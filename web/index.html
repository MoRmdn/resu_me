<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mohamed Ramadan - Professional Flutter Developer Portfolio">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mohamed Ramadan Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon: the composed-M mark, tile variant (see design/LOGO.md).
       SVG first for crisp scaling; PNGs are the fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mohamed Ramadan - Flutter Developer Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts — Archivo (display/body) & JetBrains Mono (eyebrows/labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Splash Screen Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Archivo', system-ui, sans-serif;
      overflow: hidden;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0A0A0C;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }

    #splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.1);
    }

    .logo-container {
      position: relative;
      margin-bottom: 2rem;
    }

    .logo-circle {
      width: 120px;
      height: 120px;
      border-radius: 22px;
      background: #16161B;
      border: 1px solid rgba(242, 238, 231, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-circle::before {
      content: '';
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 26px;
      border: 1px solid rgba(242, 118, 46, 0.3);
      opacity: 0.5;
      animation: ripple 2s ease-in-out infinite;
    }

    .logo-text {
      color: #F2EEE7;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -1px;
      z-index: 1;
    }

    .logo-text .accent {
      color: #F2762E;
    }

    .app-title {
      color: #F2EEE7;
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
      text-align: center;
      animation: slideInUp 0.8s ease-out 0.3s both;
    }

    .app-subtitle {
      color: rgba(242, 238, 231, 0.45);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 400;
      text-align: center;
      margin-bottom: 3rem;
      animation: slideInUp 0.8s ease-out 0.5s both;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: slideInUp 0.8s ease-out 0.7s both;
    }

    .loading-bar {
      width: 200px;
      height: 2px;
      background: rgba(242, 238, 231, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .loading-progress {
      height: 100%;
      background: #F2762E;
      border-radius: 2px;
      width: 0%;
      animation: loadingProgress 3s ease-in-out infinite;
    }

    .loading-text {
      color: rgba(242, 238, 231, 0.38);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      font-weight: 400;
    }

    .floating-dots {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #F2762E;
      border-radius: 50%;
      opacity: 0.5;
      animation: float 6s ease-in-out infinite;
    }

    .dot:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
    .dot:nth-child(2) { top: 30%; left: 80%; animation-delay: 1s; }
    .dot:nth-child(3) { top: 60%; left: 20%; animation-delay: 2s; }
    .dot:nth-child(4) { top: 70%; left: 70%; animation-delay: 3s; }
    .dot:nth-child(5) { top: 40%; left: 50%; animation-delay: 4s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes ripple {
      0% { transform: scale(1); opacity: 0.2; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loadingProgress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .logo-circle {
        width: 100px;
        height: 100px;
      }
      
      .logo-circle::before {
        width: 120px;
        height: 120px;
      }
      
      .app-title {
        font-size: 2rem;
      }
      
      .app-subtitle {
        font-size: 1rem;
      }
      
      .loading-bar {
        width: 150px;
      }
    }

    /* Hide splash screen when Flutter is ready */
    .flutter-ready #splash-screen {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Interactive Splash Screen -->
  <div id="splash-screen">
    <div class="floating-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    
    <div class="logo-container">
      <div class="logo-circle">
        <svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 39 L17 9 L24 26 L31 9 L42 39" fill="none" stroke="#F2EEE7" stroke-width="4.4" stroke-linejoin="miter" stroke-linecap="square"/>
          <path d="M24 26 L31 9 L42 39" fill="none" stroke="#F2762E" stroke-width="4.4" stroke-linejoin="miter" stroke-linecap="square"/>
        </svg>
      </div>
    </div>

    <h1 class="app-title">Mohamed Ramadan</h1>
    <p class="app-subtitle">Flutter Developer · Obsidian &amp; Copper</p>
    
    <div class="loading-container">
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
      <p class="loading-text">Loading your experience...</p>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Splash Screen Script -->
  <script>
    // Wait for Flutter to be ready
    window.addEventListener('flutter-first-frame', function () {
      // Add a small delay for better UX
      setTimeout(() => {
        const splashScreen = document.getElementById('splash-screen');
        splashScreen.classList.add('fade-out');
        
        // Remove splash screen after animation
        setTimeout(() => {
          splashScreen.style.display = 'none';
          document.body.classList.add('flutter-ready');
        }, 500);
      }, 1000);
    });

    // Fallback: Hide splash screen after 5 seconds if Flutter doesn't load
    setTimeout(() => {
      const splashScreen = document.getElementById('splash-screen');
      if (splashScreen && !document.body.classList.contains('flutter-ready')) {
        splashScreen.classList.add('fade-out');
        setTimeout(() => {
          splashScreen.style.display = 'none';
          document.body.classList.add('flutter-ready');
        }, 500);
      }
    }, 5000);

    // Add click interaction for better UX
    document.getElementById('splash-screen').addEventListener('click', function() {
      // Optional: Add a subtle interaction effect
      this.style.transform = 'scale(0.98)';
      setTimeout(() => {
        this.style.transform = 'scale(1)';
      }, 150);
    });
  </script>
</body>
</html>
